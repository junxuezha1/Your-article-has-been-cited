<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}引用通知系统{% endblock %} — 《创新与创业教育》</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #1a5276;
            --primary-light: #2980b9;
            --bg-light: #f4f6f9;
        }
        body { background: var(--bg-light); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
        .sidebar {
            position: fixed; top: 0; left: 0; bottom: 0; width: 240px;
            background: var(--primary); color: #fff; padding-top: 0;
            z-index: 100; overflow-y: auto;
        }
        .sidebar .brand {
            padding: 20px 16px; font-size: 15px; font-weight: 700;
            border-bottom: 1px solid rgba(255,255,255,.15); line-height: 1.5;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.7); padding: 12px 20px; font-size: 14px;
            display: flex; align-items: center; gap: 10px; transition: .2s;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: #fff; background: rgba(255,255,255,.1);
        }
        .sidebar .nav-link .bi { font-size: 18px; width: 22px; text-align: center; }
        .sidebar .step-badge {
            background: rgba(255,255,255,.2); border-radius: 50%;
            width: 22px; height: 22px; font-size: 12px;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .main-content { margin-left: 240px; padding: 24px 32px; min-height: 100vh; }
        .page-header { margin-bottom: 24px; }
        .page-header h1 { font-size: 22px; font-weight: 700; color: var(--primary); margin: 0; }
        .page-header p { color: #666; margin: 4px 0 0; font-size: 14px; }
        .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.08); border-radius: 10px; }
        .card-header { background: #fff; font-weight: 600; border-bottom: 1px solid #eee; }
        .stat-card {
            text-align: center; padding: 20px; border-radius: 10px;
            background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08);
        }
        .stat-card .number { font-size: 32px; font-weight: 700; color: var(--primary); }
        .stat-card .label { font-size: 13px; color: #888; margin-top: 4px; }
        .table { font-size: 13px; }
        .table th { background: #f8f9fa; font-weight: 600; white-space: nowrap; }
        .btn-primary { background: var(--primary); border-color: var(--primary); }
        .btn-primary:hover { background: var(--primary-light); border-color: var(--primary-light); }
        .email-preview-frame {
            border: 1px solid #ddd; border-radius: 8px; background: #fff;
            padding: 0; overflow: hidden;
        }
        .email-preview-frame iframe {
            width: 100%; height: 450px; border: none;
        }
        .flash-messages { position: sticky; top: 0; z-index: 50; }
        .task-running {
            background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
            padding: 12px 16px; display: flex; align-items: center; gap: 10px;
        }
        .spinner-border-sm { width: 1rem; height: 1rem; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; position: relative; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>
    <!-- 侧边栏 -->
    <nav class="sidebar">
        <div class="brand">
            <i class="bi bi-journal-richtext"></i> 引用通知系统<br>
            <small style="font-weight:400;opacity:.7">《创新与创业教育》</small>
        </div>
        <a href="{{ url_for('index') }}" class="nav-link {% if request.endpoint == 'index' %}active{% endif %}">
            <i class="bi bi-house"></i> 首页概览
        </a>
        <a href="{{ url_for('config_page') }}" class="nav-link {% if request.endpoint == 'config_page' %}active{% endif %}">
            <i class="bi bi-gear"></i> 系统配置
        </a>
        <a href="{{ url_for('extract_page') }}" class="nav-link {% if request.endpoint == 'extract_page' %}active{% endif %}">
            <span class="step-badge">1</span> 提取参考文献
        </a>
        <a href="{{ url_for('lookup_page') }}" class="nav-link {% if request.endpoint == 'lookup_page' %}active{% endif %}">
            <span class="step-badge">2</span> 检索作者邮箱
        </a>
        <a href="{{ url_for('send_page') }}" class="nav-link {% if request.endpoint == 'send_page' %}active{% endif %}">
            <span class="step-badge">3</span> 预览与发送
        </a>
    </nav>

    <!-- 主内容 -->
    <div class="main-content">
        <!-- Flash 消息 -->
        <div class="flash-messages">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endfor %}
            {% endif %}
            {% endwith %}
        </div>

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
