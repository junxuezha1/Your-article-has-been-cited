# ============================================================
# 《创新与创业教育》引用通知系统 — 配置文件示例
# 使用前请复制为 config.yaml 并填写实际配置
# ============================================================

# ---- SMTP 邮件发送配置 ----
smtp:
  server: "smtp.qq.com"          # SMTP 服务器地址
  port: 465                      # 端口号（SSL=465, TLS=587）
  use_ssl: true                  # true=SSL, false=TLS
  username: "your_email@qq.com"  # 发件人邮箱
  password: "your_auth_code"     # 邮箱授权码（非登录密码）
  sender_name: "由当前刊物自动决定"

# ---- 邮件设置 ----
email:
  subject: "您的文章在《创新与创业教育》中被引用的通知"
  send_interval_seconds: 8
  template_file: "templates/notification.html"

# ---- Web 应用 ----
app:
  secret_key: "change-this-secret-key"

# ---- 产品信息（品牌占位，正式发布前替换）----
product:
  name: "{{PRODUCT_NAME}}"
  id: "{{PRODUCT_ID}}"
  version: "{{VERSION}}"
  logo: "assets/logo.png"
  logo_light: "assets/logo-light.png"
  favicon: "assets/favicon.ico"
  app_icon: "assets/app.ico"
  support: "{{SUPPORT_CONTACT}}"

# ---- 默认刊物信息（网页中会按当前切换的刊物覆盖名称和口吻）----
journal:
  name: "创新与创业教育"
  name_en: "Innovation and Entrepreneurship Education"
  issn: ""
  website: ""

# ---- 数据文件路径 ----
paths:
  # 运行数据由当前刊物自动隔离到 data/innovation 或 data/csu_social。
  # 以下只保留本地作者库目录作为全局配置。
  local_db_dir: "数据"
